    <style>

        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #06020f;
        }

        main {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #06020f;
        }

        main::-webkit-scrollbar {
            width: 4px;
        }

        main::-webkit-scrollbar-track {
            background: transparent;
        }

        main::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
            border-radius: 2px;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-120px);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

        .glow-sm {
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.5), 0 0 5px rgba(0, 251, 251, 0.3);
        }

            background: linear-gradient(to bottom, transparent 50%, rgba(168, 85, 247, 0.04) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 30;
        }

        .scanline-bar {
            position: absolute;
            width: 100%;
            height: 120px;
            background: linear-gradient(to bottom, transparent, rgba(217, 70, 239, 0.12) 50%, transparent);
            animation: scanline 8s linear infinite;
            z-index: 29;
            pointer-events: none;
            top: 0;
        }

        .cyber-grid {
            background-image: linear-gradient(to right, rgba(168, 85, 247, 0.05) 1px, transparent 1px),

            background-size: 40px 40px;
        }

        /* Aurora orb blobs */
        @keyframes orb-drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.18;
            }

            33% {
                transform: translate(30px, -20px) scale(1.15);
                opacity: 0.28;
            }

            66% {
                transform: translate(-20px, 25px) scale(0.9);
                opacity: 0.14;
            }
        }

        @keyframes orb-drift2 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.15;
            }

            40% {
                transform: translate(-40px, 30px) scale(1.2);
                opacity: 0.25;
            }

            70% {
                transform: translate(25px, -35px) scale(0.85);
                opacity: 0.12;
            }
        }

        @keyframes orb-drift3 {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.12;
            }

            50% {
                transform: translate(20px, 40px) scale(1.1);
                opacity: 0.22;
            }
        }

        @keyframes aurora-sweep {
            0% {
                background-position: 0% 50%;
                opacity: 0.07;
            }

            50% {
                background-position: 100% 50%;
                opacity: 0.13;
            }

            100% {
                background-position: 0% 50%;
                opacity: 0.07;
            }
        }

        .aurora-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(125deg,
                    rgba(15, 5, 30, 0.0) 0%,
                    rgba(168, 85, 247, 0.12) 20%,
                    rgba(217, 70, 239, 0.10) 45%,
                    rgba(0, 251, 251, 0.08) 70%,
                    rgba(120, 0, 255, 0.08) 90%,
                    rgba(15, 5, 30, 0.0) 100%);
            background-size: 300% 300%;
            animation: aurora-sweep 12s ease-in-out infinite;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.20) 0%, transparent 70%);
            animation: orb-drift 14s ease-in-out infinite;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            bottom: -120px;
            right: -100px;
            background: radial-gradient(circle, rgba(120, 0, 255, 0.20) 0%, transparent 70%);
            animation: orb-drift2 18s ease-in-out infinite;
        }

        .orb-3 {
            width: 350px;
            height: 350px;

            left: 60%;

            animation: orb-drift3 22s ease-in-out infinite;

            width: 300px;
            height: 300px;

            left: 10%;

            animation: orb-drift 20s ease-in-out infinite reverse;

        /* Vignette darkening edges */

            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
                    transparent 40%,
                    rgba(6, 2, 15, 0.6) 70%,
                    rgba(6, 2, 15, 0.95) 100%);
            pointer-events: none;
        }

        /* Binary rain scroll */
        @keyframes bin-scroll {

                transform: translateY(-50%);

            to {
                transform: translateY(0%);

        .binary-stream {
            animation: bin-scroll 8s linear infinite;
        }

        .center-main-group {
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        @media (min-width: 1100px) and (min-height: 750px) {
            .center-main-group {
                transform: translateY(18px);
            }
        }

        .mobile-particle-title-slot {
            height: 52px;
            margin-bottom: 4px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

        @media (min-width: 640px) {

            .avatar-container {

            }

        @supports (padding: max(0px)) {
            main {
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));

        @keyframes gradient-shift {

            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

        .hologram-text {

            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            display: inline-block;
            background: linear-gradient(to right, #ffffff 0%, #00fbfb 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.6);
            filter: drop-shadow(0 0 6px rgba(0, 251, 251, 0.6));

            }
        }

        @media (min-height: 750px) and (min-width: 1100px) {
            .hologram-text {
                font-size: 1.3rem;
            }
        }

        @keyframes shine-sweep {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes holo-flicker {

            0%,
            19.999%,
            22%,
            62.999%,
            64%,
            64.999%,
            70%,
            100% {
                opacity: 0.99;
                filter: hue-rotate(0deg) saturate(1);
            }

            20%,
            21.999%,
            63%,
            63.999%,
            65%,
            69.999% {
                opacity: 0.5;
                filter: hue-rotate(90deg) saturate(1.3);
            }

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }

        .player-widget {
            width: 216px;
            max-width: 86vw;
            padding: 8px 12px;

            border-radius: 12px;

            border: 1px solid rgba(0, 251, 251, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(0, 251, 251, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .player-widget:hover {
            border-color: rgba(0, 251, 251, 0.45);

        /* Explicit, crisp typography for player contents */
        .player-user-name {

        .player-verified-icon {

        }

        .player-track-name {

            font-size: 8.5px;

            text-overflow: ellipsis;

            line-height: 1.2;

        .player-artist-name {
            font-family: 'Inter', -apple-system, sans-serif;

            font-weight: 500;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
            line-height: 1.2;
        }

        .player-ctrl-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 2px;
        }

        .player-ctrl-btn:hover {
            color: #00fbfb;
            transform: scale(1.12);
            filter: drop-shadow(0 0 6px #00fbfb);
        }

        .player-ctrl-btn:active {
            transform: scale(0.9);
        }

        .player-play-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 251, 251, 0.12);
            border: 1px solid rgba(0, 251, 251, 0.45);
            color: #00fbfb;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px rgba(0, 251, 251, 0.2);
            padding: 0;
        }

        .player-play-btn:hover {
            background: rgba(0, 251, 251, 0.25);
            transform: scale(1.08);
            box-shadow: 0 0 12px rgba(0, 251, 251, 0.5);
        }

        .player-play-btn:active {
            transform: scale(0.95);
        }

        .player-time-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.05em;
            line-height: 1;
        }

        .player-track-bar-container {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .player-track-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00fbfb, #d946ef);
            border-radius: 999px;
            box-shadow: 0 0 6px rgba(0, 251, 251, 0.6);
            transition: width 0.1s linear;
        }

        .player-art-wrap {
            position: relative;
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            max-width: 26px;
            max-height: 26px;
            flex-shrink: 0;
            border-radius: 50%;
        }

        .player-art-img {
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            max-width: 26px;
            max-height: 26px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(0, 251, 251, 0.4);
            display: block;
            animation: disc-spin 8s linear infinite;
        }

        @keyframes disc-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .player-status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 6.5px;
            height: 6.5px;
            border-radius: 50%;
            border: 1px solid #06020f;
        }

        .social-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(18, 7, 33, 0.6);
            border: 1px solid rgba(217, 70, 239, 0.25);
            color: rgba(243, 232, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .social-btn svg {
            width: 13px;
            height: 13px;
        }

        @media (min-height: 750px) and (min-width: 1100px) {
            .social-btn {
                width: 34px;
                height: 34px;
            }
            .social-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        /* Responsive HUD Panels */
        .hud-panel-left {
            position: absolute;
            left: 1rem;
            top: 3.5rem;
            bottom: 1.5rem;
            width: 13.5rem; /* 216px */
            max-height: calc(100vh - 5rem);
            transition: all 0.3s ease;
        }

        .hud-panel-right {
            position: absolute;
            right: 1rem;
            top: 3.5rem;
            bottom: 1.5rem;
            width: 13.5rem; /* 216px */
            max-height: calc(100vh - 5rem);
            transition: all 0.3s ease;
        }

        .hud-radar-box {
            width: 6.25rem;
            height: 6.25rem;
            transition: all 0.3s ease;
        }

        @media (min-height: 750px) and (min-width: 1100px) {
            .hud-panel-left {
                left: 2rem;
                top: 5.5rem;
                bottom: 5.5rem;
                width: 16rem; /* 256px */
            }
            .hud-panel-right {
                right: 2rem;
                top: 5.5rem;
                bottom: 5.5rem;
                width: 16rem; /* 256px */
            }
            .hud-radar-box {
                width: 8rem;
                height: 8rem;
            }
        }

        .social-btn:hover,
        .social-btn:active {
            color: #d946ef;
            border-color: #00fbfb;
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.4), inset 0 0 8px rgba(0, 251, 251, 0.2);
            transform: translateY(-3px);
        }

        .paused {
            animation-play-state: paused !important;
        }

        #volume-slider::-webkit-slider-runnable-track {
            height: 4px;
            background: rgba(0, 251, 251, 0.15);
            border-radius: 2px;
        }

        #volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00fbfb;
            cursor: pointer;
            margin-top: -2px;
            box-shadow: 0 0 8px #00fbfb;
            transition: transform 0.1s;
        }

        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Custom Cyberpunk Bracket HUD Cursor Styles */
        @media (pointer: fine) {

            *,
            *:before,
            *:after {
                cursor: none !important;
            }

            .custom-cursor-dot {
                width: 4px;
                height: 4px;
                background-color: #00fbfb;
                box-shadow: 0 0 6px #00fbfb, 0 0 12px rgba(0, 251, 251, 0.6);
                border-radius: 50%;
                position: fixed;
                transform: translate(-50%, -50%);
                pointer-events: none;
                z-index: 10000;
                transition: opacity 0.2s, background-color 0.2s, box-shadow 0.2s;
            }

            .custom-cursor-hud {
                width: 24px;
                height: 24px;
                position: fixed;
                pointer-events: none;
                z-index: 9999;
                transition: opacity 0.2s, width 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), height 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            .custom-cursor-hud .corner {
                position: absolute;
                width: 6px;
                height: 6px;
                border-color: #00fbfb;
                border-style: solid;
                transition: border-color 0.2s, border-width 0.2s;
                filter: drop-shadow(0 0 2px rgba(0, 251, 251, 0.5));
            }

            .custom-cursor-hud .tl {
                top: 0;
                left: 0;
                border-width: 1.5px 0 0 1.5px;
            }

            .custom-cursor-hud .tr {
                top: 0;
                right: 0;
                border-width: 1.5px 1.5px 0 0;
            }

            .custom-cursor-hud .bl {
                bottom: 0;
                left: 0;
                border-width: 0 0 1.5px 1.5px;
            }

            .custom-cursor-hud .br {
                bottom: 0;
                right: 0;
                border-width: 0 1.5px 1.5px 0;
            }

            /* Hover state for interactive elements (Magenta theme match) */
            .custom-cursor-dot.hovered {
                background-color: #d946ef;
                box-shadow: 0 0 8px #d946ef, 0 0 16px #d946ef;
            }

            .custom-cursor-hud.hovered {
                width: 38px;
                height: 38px;
            }

            .custom-cursor-hud.hovered .corner {
                border-color: #d946ef;
                border-width: 2px;
                filter: drop-shadow(0 0 4px rgba(217, 70, 239, 0.6));
            }

            /* Click states (Magenta active) */
            .custom-cursor-dot.clicked {
                background-color: #ff00b4;
                box-shadow: 0 0 12px #ff00b4, 0 0 24px #ff00b4;
            }

            .custom-cursor-hud.clicked {
                width: 14px;
                height: 14px;
            }

            .custom-cursor-hud.clicked .corner {
                border-color: #ff00b4;
                border-width: 2px;
                filter: drop-shadow(0 0 5px rgba(255, 0, 180, 0.8));
            }
        }
    </style>
</head>

        <div class="absolute inset-0 w-full h-full z-[1] bg-transparent" id="threejs-container-ANIMATION_1"></div>
        <script>
            (function () {
                const container = document.getElementById('threejs-container-ANIMATION_1');
                const width = container.clientWidth || window.innerWidth;
                const height = container.clientHeight || window.innerHeight;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                camera.position.z = 130;

                const isLowPowerDevice = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4)
                    || (navigator.deviceMemory && navigator.deviceMemory <= 4);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: !isLowPowerDevice, powerPreference: 'high-performance' });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, isLowPowerDevice ? 1.25 : 2));
                container.appendChild(renderer.domElement);

                const mouse = { x: 0, y: 0, active: false };

                function generatePoints(isMob) {
                    const textCanvas = document.createElement('canvas');
                    const ctx = textCanvas.getContext('2d');
                    textCanvas.width = 1024;
                    textCanvas.height = 512;
                    ctx.fillStyle = 'white';
                    ctx.textBaseline = 'middle';
                    ctx.textAlign = 'center';

                    let zJitter;
                    if (isMob) {
                        // Mobile: High-clarity Inter font with letter-spacing and tight z-jitter
                        if ('letterSpacing' in ctx) {
                            ctx.letterSpacing = '6px';
                        }
                        ctx.font = '800 230px "Inter", "Segoe UI", -apple-system, sans-serif';
                        ctx.fillText('Ga kon', 512, 256);
                        zJitter = 2.5;
                    } else {
                        // Desktop: Exactly original bold sans-serif with original deep z-jitter
                        ctx.font = 'bold 240px sans-serif';
                        ctx.fillText('Ga kon', 512, 256);
                        zJitter = 15;
                    }

                    const step = isLowPowerDevice ? 4 : 3;
                    const imageData = ctx.getImageData(0, 0, 1024, 512).data;
                    const rawPoints = [];
                    let minX = 1024, maxX = 0;

                    for (let y = 0; y < 512; y += step) {
                        for (let x = 0; x < 1024; x += step) {
                            const alpha = imageData[(y * 1024 + x) * 4 + 3];
                            if (alpha > 128) {
                                rawPoints.push({ x, y, z: (Math.random() - 0.5) * zJitter });
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                            }
                        }
                    }

                    const halfTextSpan = Math.max(512 - minX, maxX - 512) || 360;
                    return rawPoints.map(pt => ({
                        x: (pt.x - 512) / halfTextSpan,
                        y: (256 - pt.y) / halfTextSpan,
                        z: pt.z
                    }));
                }

                const mobilePoints = generatePoints(true);
                const desktopPoints = generatePoints(false);
                const maxPoints = Math.max(mobilePoints.length, desktopPoints.length);

                const positions = new Float32Array(maxPoints * 3);
                const initialPositions = new Float32Array(maxPoints * 3);
                const colors = new Float32Array(maxPoints * 3);
                const particlePhases = new Float32Array(maxPoints);

                let activeIsMob = width < 640;
                let normPoints = activeIsMob ? mobilePoints : desktopPoints;
                let particleCount = normPoints.length;

                let geometry = null;

                function setupParticlesForMode(isMob) {
                    normPoints = isMob ? mobilePoints : desktopPoints;
                    particleCount = normPoints.length;
                    for (let i = 0; i < particleCount; i++) {
                        const pt = normPoints[i];
                        const normX0 = Math.max(0, Math.min(1, (pt.x + 1) / 2));
                        const hue0 = 0.5 + normX0 * 0.333;
                        const c0 = new THREE.Color().setHSL(hue0, 1.0, 0.58);
                        colors[i * 3] = c0.r;
                        colors[i * 3 + 1] = c0.g;
                        colors[i * 3 + 2] = c0.b;
                        particlePhases[i] = Math.random() * Math.PI * 2;
                    }
                    if (geometry) {
                        geometry.setDrawRange(0, particleCount);
                        geometry.attributes.color.needsUpdate = true;
                    }
                }

                setupParticlesForMode(activeIsMob);

                // Dynamically calculate particle layout to fit screen and match layout
                const updateTextDimensions = () => {
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || window.innerHeight;
                    const isMob = w < 640;

                    if (isMob !== activeIsMob) {
                        activeIsMob = isMob;
                        setupParticlesForMode(isMob);
                    }

                    camera.position.z = 130;
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();

                    const halfHeight = Math.tan((camera.fov * Math.PI / 180) / 2) * camera.position.z;
                    const pxToWorld = (2 * halfHeight) / h;

                    const avatarEl = document.querySelector('.avatar-container');
                    const mobileTitleSlot = document.querySelector('.mobile-particle-title-slot');
                    let textCenterPixelY;
                    let targetWidthPx;

                    if (isMob) {
                        // On mobile: position Ga kon clearly above the avatar in its dedicated hero slot
                        if (mobileTitleSlot) {
                            const sRect = mobileTitleSlot.getBoundingClientRect();
                            textCenterPixelY = sRect.top + sRect.height / 2;
                        } else if (avatarEl) {
                            const aRect = avatarEl.getBoundingClientRect();
                            textCenterPixelY = aRect.top - 50;
                        } else {
                            textCenterPixelY = h * 0.22;
                        }
                        targetWidthPx = Math.min(w * 0.82, 315);
                        if (material) {
                            material.size = 1.15;
                        }
                    } else {
                        // On desktop / Safari:
                        if (avatarEl) {
                            const rect = avatarEl.getBoundingClientRect();
                            textCenterPixelY = rect.top + rect.height / 2;
                        } else {
                            textCenterPixelY = h * 0.35;
                        }
                        const isCompact = h < 720 || w < 1100;
                        if (isCompact) {
                            targetWidthPx = Math.min(w * 0.42, 380);
                            if (material) {
                                material.size = 1.35;
                            }
                        } else {
                            targetWidthPx = Math.min(w * 0.56, 620);
                            if (material) {
                                material.size = 2.0;
                            }
                        }
                    }

                    const halfTextWorldWidth = (targetWidthPx * pxToWorld) / 2;
                    const normCenterY = -(textCenterPixelY / h) * 2 + 1;
                    const textCenterY = normCenterY * halfHeight;

                    for (let i = 0; i < particleCount; i++) {
                        const pt = normPoints[i];
                        initialPositions[i * 3] = pt.x * halfTextWorldWidth;
                        initialPositions[i * 3 + 1] = pt.y * halfTextWorldWidth + textCenterY;
                        initialPositions[i * 3 + 2] = pt.z;
                    }
                };

                const material = new THREE.PointsMaterial({
                    size: (width < 640) ? 1.15 : (height < 720 || width < 1100 ? 1.35 : 2.0),
                    vertexColors: true,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    opacity: 0.9
                });

                updateTextDimensions();

                // Initial particle explosion animation towards initial positions
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = initialPositions[i * 3] + (Math.random() - 0.5) * 300;
                    positions[i * 3 + 1] = initialPositions[i * 3 + 1] + (Math.random() - 0.5) * 300;
                    positions[i * 3 + 2] = initialPositions[i * 3 + 2] + (Math.random() - 0.5) * 300;
                }

                geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                geometry.setDrawRange(0, particleCount);

                const particles = new THREE.Points(geometry, material);
                scene.add(particles);

                const bgGeometry = new THREE.BufferGeometry();
                const bgParticleCount = isLowPowerDevice ? 700 : 1400;
                const bgPositions = new Float32Array(bgParticleCount * 3);
                const bgColors = new Float32Array(bgParticleCount * 3);
                for (let i = 0; i < bgParticleCount; i++) {
                    bgPositions[i * 3] = (Math.random() - 0.5) * 1000;
                    bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 1000;
                    bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 500 - 200;
                    const starHue = 0.5 + Math.random() * 0.35;
                    const sc = new THREE.Color().setHSL(starHue, 0.9, 0.6 + Math.random() * 0.3);
                    bgColors[i * 3] = sc.r; bgColors[i * 3 + 1] = sc.g; bgColors[i * 3 + 2] = sc.b;
                }
                bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
                bgGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
                const bgMaterial = new THREE.PointsMaterial({ size: 1.4, vertexColors: true, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
                const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
                scene.add(bgParticles);

                // Outer ring / nebula particles drifting in orbit
                const ringGeo = new THREE.BufferGeometry();
                const ringCount = isLowPowerDevice ? 150 : 300;
                const ringPos = new Float32Array(ringCount * 3);
                const ringCol = new Float32Array(ringCount * 3);
                for (let i = 0; i < ringCount; i++) {
                    const angle = (i / ringCount) * Math.PI * 2;
                    const r = 200 + (Math.random() - 0.5) * 120;
                    ringPos[i * 3] = Math.cos(angle) * r;
                    ringPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
                    ringPos[i * 3 + 2] = Math.sin(angle) * r * 0.4 - 100;
                    const rc = new THREE.Color().setHSL(0.5 + Math.random() * 0.3, 1.0, 0.55);
                    ringCol[i * 3] = rc.r; ringCol[i * 3 + 1] = rc.g; ringCol[i * 3 + 2] = rc.b;
                }
                ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
                ringGeo.setAttribute('color', new THREE.BufferAttribute(ringCol, 3));
                const ringMat = new THREE.PointsMaterial({ size: 2.5, vertexColors: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
                const ringParticles = new THREE.Points(ringGeo, ringMat);
                scene.add(ringParticles);

                const raycaster = new THREE.Raycaster();
                const mouseVec = new THREE.Vector2();
                const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                const mouseTarget = new THREE.Vector3();

                window.addEventListener('mousemove', (e) => {
                    if (window.innerWidth >= 640 || (window.matchMedia && window.matchMedia('(pointer: fine)').matches)) {
                        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                        mouse.active = true;
                    }
                }, { passive: true });

                document.addEventListener('mouseleave', () => {
                    mouse.active = false;
                });

                const handleTouch = (touch) => {
                    mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                    mouse.active = true;
                };
                window.addEventListener('touchstart', (e) => {
                    if (e.touches && e.touches.length > 0) handleTouch(e.touches[0]);
                }, { passive: true });
                window.addEventListener('touchmove', (e) => {
                    if (e.touches && e.touches.length > 0) handleTouch(e.touches[0]);
                }, { passive: true });
                window.addEventListener('touchend', () => {
                    mouse.active = false;
                }, { passive: true });
                window.addEventListener('touchcancel', () => {
                    mouse.active = false;
                }, { passive: true });

                let lastFrameTime = 0;
                let frameNumber = 0;
                const animate = (frameTime = 0) => {
                    requestAnimationFrame(animate);
                    if (document.hidden || (isLowPowerDevice && frameTime - lastFrameTime < 32)) return;
                    lastFrameTime = frameTime;
                    frameNumber++;
                    const posAttr = geometry.attributes.position;
                    const colorAttr = geometry.attributes.color;
                    const time = Date.now() * 0.001;

                    bgParticles.rotation.y += 0.0003;
                    bgParticles.rotation.x += 0.00008;
                    ringParticles.rotation.y += 0.0006;
                    ringParticles.rotation.z += 0.0002;

                    if (mouse.active) {
                        mouseVec.set(mouse.x, mouse.y);
                        raycaster.setFromCamera(mouseVec, camera);
                        raycaster.ray.intersectPlane(planeZ, mouseTarget);
                    }

                    const halfHeight = Math.tan((camera.fov * Math.PI / 180) / 2) * camera.position.z;
                    const vHeight = container.clientHeight || window.innerHeight;
                    // Localized touch/cursor radius: ~45px on screen
                    const repelRadius = Math.max(12, 45 * ((2 * halfHeight) / vHeight));
                    const repelRadiusSq = repelRadius * repelRadius;

                    for (let i = 0; i < particleCount; i++) {
                        const i3 = i * 3;
                        let repelled = false;
                        if (mouse.active) {
                            const dx = posAttr.array[i3] - mouseTarget.x;
                            const dy = posAttr.array[i3 + 1] - mouseTarget.y;
                            const distSquared = dx * dx + dy * dy;
                            if (distSquared < repelRadiusSq) {
                                const dist = Math.sqrt(distSquared);
                                const force = (repelRadius - dist) / repelRadius;
                                const pushX = (dist > 0.001 ? dx / dist : (Math.random() - 0.5)) * force * 3.5;
                                const pushY = (dist > 0.001 ? dy / dist : (Math.random() - 0.5)) * force * 3.5;
                                posAttr.array[i3] += pushX;
                                posAttr.array[i3 + 1] += pushY;
                                posAttr.array[i3 + 2] += (Math.random() - 0.5) * force * 3.0;
                                repelled = true;
                            }
                        }
                        if (!repelled) {
                            posAttr.array[i3] += (initialPositions[i3] - posAttr.array[i3]) * 0.08;
                            posAttr.array[i3 + 1] += (initialPositions[i3 + 1] - posAttr.array[i3 + 1]) * 0.08;
                            posAttr.array[i3 + 2] += (initialPositions[i3 + 2] - posAttr.array[i3 + 2]) * 0.08;
                        }
                        posAttr.array[i3 + 1] += Math.sin(time + i * 0.1) * 0.04;

                        // --- Cool-tone neon color wave ---
                        // The wave is slow; updating colors every other frame preserves its appearance with less work.
                        if (frameNumber % 2 !== 0) continue;
                        const nX = Math.max(0, Math.min(1, (normPoints[i].x + 1) / 2));
                        // slow horizontal wave + per-particle shimmer
                        const hueVal = 0.48 + 0.36 * ((nX + time * 0.07 + particlePhases[i] * 0.04) % 1.0);
                        // brightness: subtle pulse, never goes warm
                        const bri = 0.52 + 0.16 * Math.sin(time * 0.9 + particlePhases[i]);
                        // inline HSL→RGB (s=1 so simplified)
                        const h6 = (((hueVal % 1) + 1) % 1) * 6;
                        const fh = Math.floor(h6);
                        const frac = h6 - fh;
                        const q = bri * (1 - frac);
                        const t2 = bri * frac;
                        let rr, gg, bb;
                        switch (fh) {
                            case 0: rr = bri; gg = t2; bb = 0; break;
                            case 1: rr = q; gg = bri; bb = 0; break;
                            case 2: rr = 0; gg = bri; bb = t2; break;
                            case 3: rr = 0; gg = q; bb = bri; break;
                            case 4: rr = t2; gg = 0; bb = bri; break;
                            default: rr = bri; gg = 0; bb = q; break;
                        }
                        colorAttr.array[i3] = rr;
                        colorAttr.array[i3 + 1] = gg;
                        colorAttr.array[i3 + 2] = bb;
                    }

                    if (frameNumber === 10 || frameNumber === 30) {
                        updateTextDimensions();
                    }

                    posAttr.needsUpdate = true;
                    colorAttr.needsUpdate = frameNumber % 2 === 0;
                    renderer.render(scene, camera);
                };

                animate();

                window.addEventListener('resize', () => {
                    const w = container.clientWidth || window.innerWidth;
                    const h = container.clientHeight || window.innerHeight;
                    renderer.setSize(w, h);
                    updateTextDimensions();
                });
            })();
        </script>

                                d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z" />

    </main>
    <script>
        // Load the large decorative video only after the critical UI is ready.
        window.addEventListener('load', () => {
            const loadBackgroundVideo = () => {
                const video = document.getElementById('background-video');
                const sources = video?.querySelectorAll('source[data-src]');
                if (!video || !sources?.length) return;
                sources.forEach(source => {
                    source.src = source.dataset.src;
                    source.removeAttribute('data-src');
                });
                video.load();
                video.play().catch(() => { });
            };
            if ('requestIdleCallback' in window) requestIdleCallback(loadBackgroundVideo, { timeout: 1500 });
            else setTimeout(loadBackgroundVideo, 0);
        }, { once: true });

        // Interactive mouse and touch tracking with one DOM update per animation frame.
        const parallaxGrid = document.querySelector('.cyber-grid');
        const parallaxOrbs = document.querySelectorAll('.orb');
        let parallaxX = 0, parallaxY = 0, parallaxPending = false;

        const updateParallax = (clientX, clientY) => {
            parallaxX = clientX / window.innerWidth - 0.5;
            parallaxY = clientY / window.innerHeight - 0.5;
            if (parallaxPending) return;
            parallaxPending = true;
            requestAnimationFrame(() => {
                if (parallaxGrid) parallaxGrid.style.transform = `translate(${parallaxX * 25}px, ${parallaxY * 25}px)`;
                parallaxOrbs.forEach((orb, index) => {
                    const factor = (index + 1) * -15;
                    orb.style.transform = `translate(${parallaxX * factor}px, ${parallaxY * factor}px)`;
                });
                parallaxPending = false;
            });
        };

        document.addEventListener('mousemove', (e) => {
            updateParallax(e.clientX, e.clientY);
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches.length > 0) {
                updateParallax(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });
        // Interactive Audio Player Logic
        const audioPlaylist = [
            { title: "LOVE YOURSELF", artist: "Justin Bieber", url: "music/love_yourself.mp3" },
            { title: "SORRY", artist: "Justin Bieber", url: "music/sorry.mp3" },
            { title: "BABY (FEAT. LUDACRIS)", artist: "Justin Bieber", url: "music/baby.mp3" },
            { title: "DESPACITO (REMIX)", artist: "Luis Fonsi & Daddy Yankee ft. Justin Bieber", url: "music/despacito.mp3" }
        ];

        let currentTrackIndex = 0;
        const audioEl = document.getElementById('audio-player');
        const playPauseBtn = document.getElementById('btn-play-pause');
        const playPauseIcon = document.getElementById('play-pause-icon');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const songTitleEl = document.getElementById('current-song-title');
        const songArtistEl = document.getElementById('current-song-artist');
        const playerArtEl = document.getElementById('player-art');
        const progressEl = document.getElementById('player-progress-bar');
        const statusDotEl = document.getElementById('play-status-dot');
        const timeCurrentEl = document.getElementById('player-time-current');
        const timeTotalEl = document.getElementById('player-time-total');

        const formatTime = (secs) => {
            if (isNaN(secs)) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        };

        const loadTrack = (index) => {
            const track = audioPlaylist[index];
            audioEl.src = track.url;
            songTitleEl.textContent = track.title;
            songArtistEl.textContent = track.artist;
            progressEl.style.width = '0%';
            timeCurrentEl.textContent = '0:00';
            timeTotalEl.textContent = '0:00';
        };

        const playTrack = () => {
            audioEl.play().then(() => {
                playPauseIcon.textContent = 'pause';
                playerArtEl.classList.remove('paused');
                statusDotEl.classList.remove('bg-red-500');
                statusDotEl.classList.add('bg-green-500', 'animate-pulse');
            }).catch(err => {
                console.log("Audio playback was blocked or failed:", err);
            });
        };

        const pauseTrack = () => {
            audioEl.pause();
            playPauseIcon.textContent = 'play_arrow';
            playerArtEl.classList.add('paused');
            statusDotEl.classList.remove('bg-green-500', 'animate-pulse');
            statusDotEl.classList.add('bg-red-500');
        };

        // Event Listeners
        playPauseBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                playTrack();
            } else {
                pauseTrack();
            }
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + audioPlaylist.length) % audioPlaylist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % audioPlaylist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        audioEl.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % audioPlaylist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        audioEl.addEventListener('loadedmetadata', () => {
            timeTotalEl.textContent = formatTime(audioEl.duration);
        });

        audioEl.addEventListener('timeupdate', () => {
            if (audioEl.duration) {
                const percent = (audioEl.currentTime / audioEl.duration) * 100;
                progressEl.style.width = `${percent}%`;
                timeCurrentEl.textContent = formatTime(audioEl.currentTime);
                timeTotalEl.textContent = formatTime(audioEl.duration);
            }
        });

        // Touch & Click Progress Bar Seeking
        const progressTrack = document.getElementById('player-progress-track');
        if (progressTrack) {
            const seekTrack = (e) => {
                if (!audioEl.duration) return;
                const rect = progressTrack.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                const clickX = Math.max(0, Math.min(clientX - rect.left, rect.width));
                audioEl.currentTime = (clickX / rect.width) * audioEl.duration;
            };
            progressTrack.addEventListener('click', seekTrack);
            progressTrack.addEventListener('touchstart', seekTrack, { passive: true });
        }

        // Initialize first track
        loadTrack(currentTrackIndex);


        // Set initial volume
        audioEl.volume = 0.7;

        // Entry Gate Decryption Loading Logic
        (function () {
            const gate = document.getElementById('entry-gate');
            const progress = document.getElementById('gate-loading-progress');
            const prompt = document.getElementById('gate-prompt');
            const icon = document.getElementById('gate-icon');

            if (!gate || !progress || !prompt) return;

            let percentage = 0;
            let finished = false;

            const decryptPrompts = [
                { limit: 25, text: "CONNECTING TO SECURE NODE..." },
                { limit: 55, text: "DECRYPTING CORE CHANNELS..." },
                { limit: 85, text: "ESTABLISHING COGNITIVE SYNC..." },
                { limit: 100, text: "SYNC READY. ACCESS GRANTED." }
            ];

            const interval = setInterval(() => {
                percentage += Math.floor(Math.random() * 8) + 4;
                if (percentage >= 100) {
                    percentage = 100;
                    clearInterval(interval);
                    finished = true;
                    prompt.textContent = "TAP FINGERPRINT TO ENTER";
                    prompt.className = "font-code-sm text-[10px] text-accent-cyan tracking-[0.2em] uppercase animate-pulse font-bold mt-1";
                    if (icon) {
                        icon.textContent = "lock_open";
                        icon.className = "material-symbols-outlined text-accent-cyan text-4xl animate-bounce cursor-pointer";
                    }
                } else {
                    const textObj = decryptPrompts.find(p => percentage <= p.limit) || decryptPrompts[decryptPrompts.length - 1];
                    prompt.textContent = textObj.text;
                }
                progress.style.width = `${percentage}%`;
            }, 70);

            gate.addEventListener('click', () => {
                if (finished) {
                    gate.style.opacity = '0';
                    gate.style.pointerEvents = 'none';
                    setTimeout(() => {
                        gate.remove();
                    }, 1000);
                    playTrack();
                } else {
                    // Clicking speeds it up
                    percentage += 15;
                    if (percentage > 99) percentage = 99;
                    progress.style.width = `${percentage}%`;
                }
            });
        })();

        // Custom Cyberpunk Bracket HUD Cursor Logic
        (function () {
            if (window.matchMedia('(pointer: fine)').matches) {
                const dot = document.createElement('div');
                const hud = document.createElement('div');
                dot.className = 'custom-cursor-dot';
                hud.className = 'custom-cursor-hud';

                // Add four corner bracket spans
                const corners = ['tl', 'tr', 'bl', 'br'];
                corners.forEach(c => {
                    const span = document.createElement('span');
                    span.className = `corner ${c}`;
                    hud.appendChild(span);
                });

                document.body.appendChild(dot);
                document.body.appendChild(hud);

                let mouseX = 0, mouseY = 0;
                let dotX = 0, dotY = 0;
                let outlineX = 0, outlineY = 0;
                let rotationAngle = 0;

                dot.style.opacity = '0';
                hud.style.opacity = '0';

                window.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;

                    dot.style.opacity = '1';
                    hud.style.opacity = '1';
                });

                const animateCursor = () => {
                    dotX = mouseX;
                    dotY = mouseY;
                    dot.style.left = `${dotX}px`;
                    dot.style.top = `${dotY}px`;

                    outlineX += (mouseX - outlineX) * 0.15;
                    outlineY += (mouseY - outlineY) * 0.15;
                    hud.style.left = `${outlineX}px`;
                    hud.style.top = `${outlineY}px`;

                    // Kinetic rotation based on movement speed
                    const dx = mouseX - outlineX;
                    const dy = mouseY - outlineY;
                    const speed = Math.sqrt(dx * dx + dy * dy);
                    const spinSpeed = 0.5 + Math.min(speed * 0.15, 8);
                    rotationAngle = (rotationAngle + spinSpeed) % 360;

                    hud.style.transform = `translate(-50%, -50%) rotate(${rotationAngle}deg)`;

                    requestAnimationFrame(animateCursor);
                };
                requestAnimationFrame(animateCursor);

                window.addEventListener('mousedown', () => {
                    dot.classList.add('clicked');
                    hud.classList.add('clicked');
                });

                window.addEventListener('mouseup', () => {
                    dot.classList.remove('clicked');
                    hud.classList.remove('clicked');
                });

                const updateHoverables = () => {
                    const hoverables = document.querySelectorAll('a, button, [role="button"], input[type="range"], .cursor-pointer');
                    hoverables.forEach(el => {
                        el.removeEventListener('mouseenter', addHoverClass);
                        el.removeEventListener('mouseleave', removeHoverClass);
                        el.addEventListener('mouseenter', addHoverClass);
                        el.addEventListener('mouseleave', removeHoverClass);
                    });
                };

                const addHoverClass = () => {
                    dot.classList.add('hovered');
                    hud.classList.add('hovered');
                };

                const removeHoverClass = () => {
                    dot.classList.remove('hovered');
                    hud.classList.remove('hovered');
                };

                updateHoverables();


                document.addEventListener('mouseleave', () => {
                    dot.style.opacity = '0';
                    hud.style.opacity = '0';
                });
                document.addEventListener('mouseenter', () => {
                    dot.style.opacity = '1';
                    hud.style.opacity = '1';
                });
            }
        })();
    </script>
